server:
  port: 8081

spring:
  application:
    name: sos-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sos_db?serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:flood}
    password: ${DB_PASSWORD:floodpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
